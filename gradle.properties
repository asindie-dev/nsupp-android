# nsupp Android SDK — bağımsız Gradle projesinin ayarları.
#
# `useAndroidX` ZORUNLU: SDK'nın bağımlılıkları (androidx.webkit, Compose, Firebase'in geçişli
# androidx paketleri) AndroidX'tir. Bayrak olmadan Gradle bağımlılıkları hiç çözemiyor.
android.useAndroidX=true

# JVM belleği: Kotlin + Compose derleyicisi varsayılan 512m ile OOM'a girebiliyor.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
